[project]
name = "s2s-harness"
version = "0.1.0"
description = "Rating harness for the Live S2S Arena / Stereo Headphone Check Project"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
stt-gemini = ["google-genai>=0.3"]
stt-gcp = ["google-cloud-speech>=2.26"]
audio = ["sounddevice>=0.4", "soundfile>=0.12"]
polish = ["anthropic>=0.34"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
s2s = "s2s_harness.cli.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

# The rules layer must stay pure. See CLAUDE.md and tests/test_token_boundary.py.
[tool.s2s]
pure_modules = ["s2s_harness.rules", "s2s_harness.models"]
sanctioned_llm_call_site = "s2s_harness/nodes/polish.py"
