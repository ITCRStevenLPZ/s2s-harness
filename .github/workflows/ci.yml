name: ci

# CLAUDE.md "Two-tier test gate": Tier 1 is fast, deterministic, zero API
# cost, and runs on every PR and push. No secrets in this workflow -- see
# tier2.yml for the real-API gate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  lint-and-type:
    name: lint and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync
      - name: uv run lint
        run: uv run lint
      - name: uv run mypy
        run: uv run mypy

  tier1-golden:
    name: Tier 1 golden fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync
      - name: uv run test-golden (null STT, stubbed polish, no network)
        run: uv run test-golden

  determinism:
    name: determinism suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync
      - name: pytest -k determinism (docs/EVAL_SPEC.md test_determinism.py)
        # No dedicated `uv run` gate name is defined in CLAUDE.md for this
        # suite (only lint/mypy/test-golden* are named). Same "no tests
        # collected yet -> pass" bootstrap tolerance as scripts/tasks.py,
        # applied inline since this isn't one of the five named gates.
        run: |
          set +e
          uv run pytest -k determinism -q
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "no determinism tests collected yet -- treating as a pass"
            exit 0
          fi
          exit "$code"

  token-boundary:
    name: token-boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync
      - name: no LLM SDK import outside nodes/polish.py
        run: uv run python scripts/token_boundary_check.py

  terraform:
    name: terraform validate / plan (deploy/)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # only used by the conditional plan step below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: check deploy/terraform exists
        id: has-terraform
        run: |
          if [ -d deploy/terraform ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "deploy/terraform not present yet -- skipping cleanly"
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.has-terraform.outputs.present == 'true'

      - name: terraform init (no backend, no credentials needed)
        if: steps.has-terraform.outputs.present == 'true'
        working-directory: deploy/terraform
        run: terraform init -backend=false

      - name: terraform validate
        if: steps.has-terraform.outputs.present == 'true'
        working-directory: deploy/terraform
        run: terraform validate

      # terraform plan needs a real project_id and real GCP credentials, and
      # the dedicated deployment project does not exist yet (see
      # team_findings.md). This step self-skips until repository variable
      # GCP_PROJECT_ID is set, rather than failing or faking a plan against
      # a placeholder project. Coordinate WIF provider / SA naming with
      # gcp-deploy before enabling: current values match deploy/terraform/wif.tf
      # and deploy/terraform/iam.tf (github-pool / github-provider / s2s-deployer).
      # Same repository variables as release.yml, see that file's header
      # comment for the exact confirmed values (note GCP_WIF_PROVIDER takes
      # the project NUMBER, not the project ID).
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: steps.has-terraform.outputs.present == 'true' && vars.GCP_PROJECT_ID != ''
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_EMAIL }}

      - name: terraform plan
        if: steps.has-terraform.outputs.present == 'true' && vars.GCP_PROJECT_ID != ''
        working-directory: deploy/terraform
        run: |
          terraform plan \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="github_repository_owner=${{ github.repository_owner }}" \
            -var="github_repository=${{ github.repository }}"

      - name: terraform plan skipped
        if: steps.has-terraform.outputs.present == 'true' && vars.GCP_PROJECT_ID == ''
        run: echo "GCP_PROJECT_ID repository variable not set -- no deployment project exists yet, plan skipped"
