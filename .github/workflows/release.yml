name: release

# Triggered by a `vX.Y.Z` tag per VERSIONING.md's release procedure. Builds
# the bridge container (Dockerfile, owned by gcp-deploy), pushes it to
# Google Artifact Registry tagged with BOTH the SemVer version and the full
# commit SHA (same digest, two tags), then deploys that exact digest to
# Cloud Run.
#
# No long-lived service-account JSON: authentication is Workload Identity
# Federation only (google-github-actions/auth), matching
# deploy/terraform/wif.tf (pool "github-pool", provider "github-provider")
# and deploy/terraform/iam.tf (deployer SA "s2s-deployer", scoped to
# roles/artifactregistry.writer and roles/run.developer -- deliberately NOT
# broad enough to run `terraform apply` against the rest of the stack, which
# is why this workflow deploys with `gcloud run deploy --image` by digest
# rather than terraform apply. See team_findings.md [T4] for the
# coordination trace with gcp-deploy.
#
# GCP_WIF_PROVIDER, GCP_DEPLOYER_SA_EMAIL, GCP_PROJECT_ID, GCP_REGION and
# GCP_ARTIFACT_REGISTRY_PATH are repository variables (vars.*), not
# secrets -- WIF issues short-lived tokens, there is nothing long-lived to
# protect. They are unset until gcp-deploy's project exists; every gcloud
# step below will fail loudly (not silently) until then, which is correct:
# a release tag pushed before the deployment project exists should fail.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-push-deploy:
    name: build, push, deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: verify pyproject.toml version matches the tag
        # VERSIONING.md: the tag is created from an already-merged version
        # bump PR. A mismatch here means the tag was cut against the wrong
        # commit, not that this workflow should improvise a version.
        run: |
          pkg_version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$pkg_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag v${{ steps.version.outputs.version }} does not match pyproject.toml version ${pkg_version}"
            exit 1
          fi

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_EMAIL }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: build and push (tagged with SemVer and commit SHA)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ vars.GCP_ARTIFACT_REGISTRY_PATH }}:${{ steps.version.outputs.version }}
            ${{ vars.GCP_ARTIFACT_REGISTRY_PATH }}:${{ github.sha }}

      - name: deploy to Cloud Run by digest
        # Deliberately gcloud run deploy --image=...@digest, not
        # terraform apply -- see the header comment. Never deploy by the
        # mutable tag; a later retag must not silently change what runs.
        run: |
          gcloud run deploy s2s-harness-bridge \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --image="${{ vars.GCP_ARTIFACT_REGISTRY_PATH }}@${{ steps.build.outputs.digest }}"
